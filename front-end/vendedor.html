<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Vendedor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Panel de Vendedor</h1>
    <p>Bienvenido, <span id="nombreUsuario"></span></p>
    <button id="btnLogout">Cerrar sesión</button>

    <hr>

    <!-- PASO 1: Lista de Vehículos -->
    <h2>1. Selecciona un vehículo de la lista</h2>
    <div id="listaVehiculos">Cargando vehículos...</div>

    <hr>

    <!-- PASO 2: Botón de acción al tocar un auto -->
    <div id="panelSeleccion" style="display: none;">
        <h3>Vehículo seleccionado: <span id="nombreAutoSeleccionado"></span></h3>
        <button id="btnAbrirForm" onclick="mostrarFormulario()">Modificar este vehículo</button>
    </div>

    <!-- PASO 3: Formulario con todos los datos precargados -->
    <div id="seccionEditar" style="display: none; margin-top: 20px;">
        <h3>Editar datos del vehículo</h3>
        <form id="formModificar">
            <!-- ID Encriptado Oculto -->
            <input type="hidden" id="edit_id" name="id">
            <input type="hidden" id="edit_idSucursal" name="idSucursal">

            <p>
                <label>Marca:</label><br>
                <input type="text" id="edit_marca" name="marca" required>
            </p>

            <p>
                <label>Modelo:</label><br>
                <input type="text" id="edit_modelo" name="modelo" required>
            </p>

            <p>
                <label>Patente:</label><br>
                <input type="text" id="edit_patente" name="patente">
            </p>

            <p>
                <label>Año:</label><br>
                <input type="number" id="edit_anio" name="anio">
            </p>

            <p>
                <label>Kilómetros (km):</label><br>
                <input type="number" id="edit_km" name="km">
            </p>

            <p>
                <label>Precio de Venta ($):</label><br>
                <input type="number" id="edit_precio" name="precio">
            </p>

            <p>
                <label>Precio Mínimo ($):</label><br>
                <input type="number" id="edit_precioMinimo" name="precioMinimo">
            </p>

            <p>
                <label>Potencia (HP):</label><br>
                <input type="number" id="edit_potencia" name="potencia">
            </p>

            <p>
                <label>Consumo (L/100km):</label><br>
                <input type="number" step="0.1" id="edit_consumo" name="consumo">
            </p>

            <p>
                <label>Estado (0 = Inactivo / 1 = Activo):</label><br>
                <input type="number" id="edit_estado" name="estado">
            </p>

            <p>
                <label>Enlace Documento Oficial:</label><br>
                <input type="text" id="edit_enlaceDocOficial" name="enlaceDocOficial">
            </p>

            <p>
                <label>Seguro SOA ($):</label><br>
                <input type="number" id="edit_seguroSOA" name="seguroSOA">
            </p>

            <p>
                <label>Seguro Terceros ($):</label><br>
                <input type="number" id="edit_seguroTerceros" name="seguroTerceros">
            </p>

            <p>
                <label>Seguro Total ($):</label><br>
                <input type="number" id="edit_seguroTotal" name="seguroTotal">
            </p>

            <p>
                <label>Descripción:</label><br>
                <textarea id="edit_descripcion" name="descripcion" rows="4" cols="40"></textarea>
            </p>

            <!-- Checkboxes de Categorías -->
            <p>
                <label><strong>Categorías:</strong></label><br>
                <div id="contenedorCategorias">Cargando categorías...</div>
            </p>

            <br>
            <button type="submit">Guardar Cambios</button>
            <button type="button" onclick="cancelarEdicion()">Cancelar</button>
        </form>
    </div>

    <script src="auth.js"></script>
    <script src="vendedor.js"></script>
</body>
</html>
