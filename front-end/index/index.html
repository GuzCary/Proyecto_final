<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Vehículos - Automotora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado con Flexbox -->
    <header class="header">
        <div class="header-logo">
            <h1>Automotora</h1>
        </div>
        <nav class="header-nav">
            <span id="total-vehiculos">Cargando catálogo...</span>
        </nav>
    </header>

    <!-- Contenedor Principal -->
    <main class="main-container">
        <!-- Grilla responsive de vehículos -->
        <section id="contenedor-vehiculos" class="vehiculos-grid">
            <!-- Los vehículos se inyectan acá con JavaScript -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
