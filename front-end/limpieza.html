<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Limpieza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Panel de Limpieza</h1>
    <p>Bienvenido, <span id="nombreUsuario"></span></p>
    <button id="btnLogout">Cerrar sesión</button>
    <hr>
    <h2>Inventario de Productos de Limpieza</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Stock Actual</th>
                <th>Acciones (Sumar / Restar)</th>
            </tr>
        </thead>
        <tbody id="cuerpoProductos"></tbody>
    </table>
    <h3>Agregar Nuevo Producto</h3>
    <form id="formNuevoProducto">
        <label for="nombreProd">Nombre del producto:</label>
        <input type="text" id="nombreProd" name="nombre" required placeholder="Ej: Jabón líquido">
        <input type="submit" value="Registrar Producto">
    </form>
    <script src="auth.js"></script>
    <script src="limpieza.js"></script>
</body>
</html>
