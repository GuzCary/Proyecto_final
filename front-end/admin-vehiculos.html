<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Vehículos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Vehículos</h1>
     <!-- Le damos la bienvenida al usuario, este se completa por JS con el nombre del usuario logueado -->
    <p>Bienvenido, <span id="nombreUsuario"></span></p>
    <button id="btnLogout">Cerrar sesión</button>
    <br><br>
    <a href="admin.html">Volver al panel</a>

    <h2>Listado de vehículos</h2>
    <!-- Tabla que se llena desde admin-vehiculos.js -->
    <table id="tablaVehiculos" border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Año</th>
                <th>Precio</th>
                <th>Sucursal</th>
                <th>Categorías</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="cuerpoVehiculos">
        </tbody>
    </table>

    <h2>Agregar vehiculo</h2>
    <form id="formVehiculo">
        <label for="vIdSucursal">ID Sucursal</label>
        <input type="number" id="vIdSucursal" name="idSucursal" required>

        <label for="vMarca">Marca</label>
        <input type="text" id="vMarca" name="marca" required>

        <label for="vModelo">Modelo</label>
        <input type="text" id="vModelo" name="modelo" required>

        <label for="vDescripcion">Descripcion</label>
        <input type="text" id="vDescripcion" name="descripcion">

        <label for="vPotencia">Potencia (HP)</label>
        <input type="number" id="vPotencia" name="potencia">

        <label for="vEstado">Estado (1 a 10)</label>
        <input type="number" id="vEstado" name="estado" min="1" max="10">

        <label for="vEnlaceDocOficial">Enlace Documento Oficial</label>
        <input type="text" id="vEnlaceDocOficial" name="enlaceDocOficial">

        <label for="vConsumo">Consumo (L/100km)</label>
        <input type="number" step="0.1" id="vConsumo" name="consumo">

        <label for="vPatente">Patente</label>
        <input type="text" id="vPatente" name="patente">

        <label for="vSeguroSOA">Seguro SOA ($)</label>
        <input type="number" step="0.01" id="vSeguroSOA" name="seguroSOA">

        <label for="vSeguroTerceros">Seguro Terceros ($)</label>
        <input type="number" step="0.01" id="vSeguroTerceros" name="seguroTerceros">

        <label for="vSeguroTotal">Seguro Total ($)</label>
        <input type="number" step="0.01" id="vSeguroTotal" name="seguroTotal">

        <label for="vAnio">Año</label>
        <input type="number" id="vAnio" name="anio">

        <label for="vKm">Kilometros</label>
        <input type="number" id="vKm" name="km">

        <label for="vPrecioMinimo">Precio minimo</label>
        <input type="number" id="vPrecioMinimo" name="precioMinimo" step="0.01">

        <label for="vPrecio">Precio</label>
        <input type="number" id="vPrecio" name="precio" step="0.01" required>

        <label for="vCategorias">Categorias (podes elegir varias)</label>
        <!-- Las opciones se cargan desde admin-vehiculos.js -->
        <!-- El [] en el name ("categorias[]") hace que PHP reciba las categorias seleccionadas como array -->
        <select id="vCategorias" name="categorias[]" multiple>
    
        </select>

        <label for="file">Imagen</label>
        <input type="file" name="file" id="file">

        <input type="submit" value="Agregar vehiculo">
    </form>

    <!-- Modal para modificar vehiculo -->
    <div id="modalEditar" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5); z-index:1000; overflow:auto;">
        <div style="background:#fff; margin:5% auto; padding:20px; width:90%; max-width:600px; border-radius:8px; position:relative;">
            <h3>Editar datos del vehiculo</h3>
            <button type="button" onclick="cerrarModal()" style="position:absolute; top:10px; right:10px;">X</button>

            <form id="formModificar">
                <input type="hidden" id="edit_id" name="id">
                <input type="hidden" id="edit_idSucursal" name="idSucursal">

                <p>
                    <label>Marca:</label><br>
                    <input type="text" id="edit_marca" name="marca" required>
                </p>

                <p>
                    <label>Modelo:</label><br>
                    <input type="text" id="edit_modelo" name="modelo" required>
                </p>

                <p>
                    <label>Patente:</label><br>
                    <input type="text" id="edit_patente" name="patente">
                </p>

                <p>
                    <label>Año:</label><br>
                    <input type="number" id="edit_anio" name="anio">
                </p>

                <p>
                    <label>Kilometros (km):</label><br>
                    <input type="number" id="edit_km" name="km">
                </p>

                <p>
                    <label>Precio de Venta ($):</label><br>
                    <input type="number" id="edit_precio" name="precio">
                </p>

                <p>
                    <label>Precio Minimo ($):</label><br>
                    <input type="number" id="edit_precioMinimo" name="precioMinimo">
                </p>

                <p>
                    <label>Potencia (HP):</label><br>
                    <input type="number" id="edit_potencia" name="potencia">
                </p>

                <p>
                    <label>Consumo (L/100km):</label><br>
                    <input type="number" step="0.1" id="edit_consumo" name="consumo">
                </p>

                <p>
                    <label>Estado (0 = Inactivo / 1 = Activo):</label><br>
                    <input type="number" id="edit_estado" name="estado">
                </p>

                <p>
                    <label>Enlace Documento Oficial:</label><br>
                    <input type="text" id="edit_enlaceDocOficial" name="enlaceDocOficial">
                </p>

                <p>
                    <label>Seguro SOA ($):</label><br>
                    <input type="number" id="edit_seguroSOA" name="seguroSOA">
                </p>

                <p>
                    <label>Seguro Terceros ($):</label><br>
                    <input type="number" id="edit_seguroTerceros" name="seguroTerceros">
                </p>

                <p>
                    <label>Seguro Total ($):</label><br>
                    <input type="number" id="edit_seguroTotal" name="seguroTotal">
                </p>

                <p>
                    <label>Descripcion:</label><br>
                    <textarea id="edit_descripcion" name="descripcion" rows="4" cols="40"></textarea>
                </p>

                <p>
                    <label><strong>Categorias:</strong></label><br>
                    <div id="contenedorCategorias">Cargando categorias...</div>
                </p>

                <br>
                <button type="submit">Guardar Cambios</button>
                <button type="button" onclick="cerrarModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="admin-vehiculos.js"></script>
</body>
</html>
