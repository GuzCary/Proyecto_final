<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendedor - Ventas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Panel de Ventas</h1>
        <button id="btnLogout" class="btn-logout">Salir</button>
    </header>

    <main class="main-container">
        <div id="mensaje" class="mensaje-alerta"></div>

        <section class="card">
            <h2>Vehículos Disponibles</h2>
            <div id="contenedor-disponibles" class="ventas-grid"></div>
        </section>

        <section class="card">
            <h2>Historial de Ventas Realizadas</h2>
            <div id="contenedor-historial" class="historial-grid"></div>
        </section>
    </main>

    <script src="../../auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
