<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Vehículos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../admin-menu.css">
</head>
<body>

    <header class="header">
        <h1>Admin - Inventario</h1>
        <nav class="nav">
            <a href="../vehiculos/index.html" class="active">Vehículos</a>
            <a href="../categorias/index.html">Categorías</a>
            <a href="../usuarios/index.html">Usuarios</a>
            <a href="../marcas/index.html">Marcas</a>
        </nav>
        <div class="header-acciones">
            <div class="config-menu">
                <button type="button" class="config-toggle" aria-haspopup="true" aria-expanded="false">⚙ Config ▾</button>
                <div class="config-dropdown" role="menu">
                    <span class="config-grupo">Empresa</span>
                    <a href="../sucursales/index.html">📍 Sucursales</a>
                    <a href="../transacciones/index.html">💵 Transacciones de caja</a>
                    <hr>
                    <span class="config-grupo">Personal</span>
                    <a href="../licencias/index.html">🪪 Licencias de conducir</a>
                    <a href="../sanciones/index.html">⚠️ Sanciones</a>
                    <a href="../aumentos/index.html">📈 Aumentos de sueldo</a>
                    <a href="../bajas/index.html">🗂️ Historial de bajas</a>
                    <hr>
                    <span class="config-grupo">Otros paneles</span>
                    <a href="../../vendedor/ventas/index.html">🧾 Ventas</a>
                    <a href="../../limpieza/productos/index.html">🧴 Insumos de limpieza</a>
                </div>
            </div>
            <button id="btnLogout" class="btn-logout">Salir</button>
        </div>
    </header>

    <main class="main-container">
        <!-- Formulario Crear/Editar -->
        <section class="card">
            <h2 id="form-titulo">Agregar Vehículo</h2>
            <form id="form-vehiculo" class="form-grid">
                <input type="hidden" id="id" name="id">

                <div class="form-group">
                    <label for="idSucursal">Sucursal</label>
                    <select id="idSucursal" name="idSucursal" required>
                        <option value="">Cargando sucursales...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" name="marca" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" name="modelo" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="precio">Precio ($)</label>
                    <input type="number" step="0.01" min="0.01" id="precio" name="precio" required>
                </div>

                <div class="form-group">
                    <label for="precioMinimo">Precio Mínimo ($)</label>
                    <input type="number" step="0.01" min="0" id="precioMinimo" name="precioMinimo">
                </div>

                <div class="form-group">
                    <label for="estado">Estado General (1 al 10)</label>
                    <input type="number" id="estado" name="estado" min="1" max="10" value="10" required>
                </div>

                <div class="form-group">
                    <label for="anio">Año</label>
                    <input type="number" id="anio" name="anio" min="1900" step="1">
                </div>

                <div class="form-group">
                    <label for="km">Kilómetros</label>
                    <input type="number" id="km" name="km" min="0" step="1">
                </div>

                <div class="form-group">
                    <label for="potencia">Potencia (HP)</label>
                    <input type="number" id="potencia" name="potencia" min="0" step="1">
                </div>

                <div class="form-group">
                    <label for="consumo">Consumo (L/100km)</label>
                    <input type="number" step="0.1" min="0" max="100" id="consumo" name="consumo">
                </div>

                <div class="form-group">
                    <label for="patente">Patente anual ($)</label>
                    <input type="number" step="0.01" min="0" id="patente" name="patente">
                </div>

                <div class="form-group">
                    <label for="seguroSOA">Seguro SOA ($)</label>
                    <input type="number" step="0.01" min="0" id="seguroSOA" name="seguroSOA">
                </div>

                <div class="form-group">
                    <label for="seguroTerceros">Seguro Terceros ($)</label>
                    <input type="number" step="0.01" min="0" id="seguroTerceros" name="seguroTerceros">
                </div>

                <div class="form-group">
                    <label for="seguroTotal">Seguro Total ($)</label>
                    <input type="number" step="0.01" min="0" id="seguroTotal" name="seguroTotal">
                </div>

                <div class="form-group full-width">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="2" maxlength="255"></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="enlaceDocOficial">Enlace a Documento Oficial</label>
                    <input type="url" id="enlaceDocOficial" name="enlaceDocOficial" maxlength="255" placeholder="https://...">
                </div>

                <div class="form-group full-width">
                    <label>Categorías</label>
                    <div id="contenedor-checkbox-categorias" class="categorias-checkbox-grid"></div>
                </div>

                <!-- Sección de fotos existentes al editar -->
                <div id="seccion-fotos-existentes" class="form-group full-width" style="display: none;">
                    <label>Imágenes actuales (marca las que quieras eliminar):</label>
                    <div id="contenedor-imagenes-existentes" class="fotos-existentes-grid"></div>
                </div>

                <div class="form-group full-width">
                    <label for="files">Subir nuevas imágenes</label>
                    <input type="file" id="files" name="files[]" multiple accept="image/*">
                </div>

                <div class="form-acciones full-width">
                    <button type="submit" class="btn-primary">Guardar</button>
                    <button type="button" id="btn-cancelar" class="btn-secondary" style="display: none;">Cancelar</button>
                </div>
            </form>
            <div id="mensaje" class="mensaje-alerta"></div>
        </section>

        <!-- Listado completo -->
        <section class="card">
            <h2>Vehículos en Inventario</h2>
            <div id="contenedor-vehiculos" class="vehiculos-admin-grid"></div>
        </section>
    </main>

    <script src="../../auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
