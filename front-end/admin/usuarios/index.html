<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Usuarios</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../admin-menu.css">
</head>
<body>

    <header class="header">
        <h1>Admin - Usuarios</h1>
        <nav class="nav">
            <a href="../vehiculos/index.html">Vehículos</a>
            <a href="../categorias/index.html">Categorías</a>
            <a href="../usuarios/index.html" class="active">Usuarios</a>
            <a href="../marcas/index.html">Marcas</a>
        </nav>
        <div class="header-acciones">
            <div class="config-menu">
                <button type="button" class="config-toggle" aria-haspopup="true" aria-expanded="false">⚙ Config ▾</button>
                <div class="config-dropdown" role="menu">
                    <span class="config-grupo">Empresa</span>
                    <a href="../sucursales/index.html">📍 Sucursales</a>
                    <a href="../transacciones/index.html">💵 Transacciones de caja</a>
                    <hr>
                    <span class="config-grupo">Personal</span>
                    <a href="../licencias/index.html">🪪 Licencias de conducir</a>
                    <a href="../sanciones/index.html">⚠️ Sanciones</a>
                    <a href="../aumentos/index.html">📈 Aumentos de sueldo</a>
                    <a href="../bajas/index.html">🗂️ Historial de bajas</a>
                    <hr>
                    <span class="config-grupo">Otros paneles</span>
                    <a href="../../vendedor/ventas/index.html">🧾 Ventas</a>
                    <a href="../../limpieza/productos/index.html">🧴 Insumos de limpieza</a>
                </div>
            </div>
            <button id="btnLogout" class="btn-logout">Salir</button>
        </div>
    </header>

    <main class="main-container">
        <section class="card">
            <h2 id="form-titulo">Agregar Usuario</h2>
            <form id="form-usuario" class="form-grid">
                <input type="hidden" id="id_encriptado" name="id_encriptado">

                <div class="form-group">
                    <label for="usuario">Nombre de usuario</label>
                    <input type="text" id="usuario" name="usuario" required autocomplete="off" minlength="3" maxlength="50" pattern="[A-Za-z0-9._\-]+" title="Letras, números, punto, guion o guion bajo (3 a 50)">
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña <span id="texto-pass">(obligatoria)</span></label>
                    <input type="password" id="contrasenia" name="contrasenia" required minlength="6" maxlength="72" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="rol">Rol del sistema</label>
                    <select id="rol" name="rol" required>
                        <option value="admin">Administrador</option>
                        <option value="user">Vendedor</option>
                        <option value="limp">Limpieza</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="id_sucursal">Sucursal</label>
                    <select id="id_sucursal" name="id_sucursal" required>
                        <option value="">Cargando sucursales...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="salarioPorHora">Salario por hora ($) <span id="texto-salario">(opcional)</span></label>
                    <input type="number" id="salarioPorHora" name="salarioPorHora" min="0" max="1000000" step="0.01">
                </div>

                <div class="form-acciones">
                    <button type="submit" id="btn-guardar" class="btn-primary">Registrar</button>
                    <button type="button" id="btn-cancelar" class="btn-secondary" style="display: none;">Cancelar</button>
                </div>
            </form>
            <div id="mensaje" class="mensaje-alerta"></div>
        </section>

        <section class="card">
            <h2>Usuarios del Sistema</h2>
            <div id="contenedor-usuarios" class="items-grid"></div>
        </section>
    </main>

    <script src="../../auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
