<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpieza - Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Insumos de Limpieza</h1>
        <button id="btnLogout" class="btn-logout">Salir</button>
    </header>

    <main class="main-container">
        <section class="card">
            <h2>Registrar Insumo</h2>
            <form id="form-producto" class="form-grid">
                <div class="form-group">
                    <label for="nombre">Nombre del Producto</label>
                    <input type="text" id="nombre" name="nombre" required autocomplete="off">
                </div>
                <button type="submit" class="btn-primary">Registrar</button>
            </form>
            <div id="mensaje" class="mensaje-alerta"></div>
        </section>

        <section class="card">
            <h2>Inventario y Control de Stock</h2>
            <div id="contenedor-productos" class="productos-grid"></div>
        </section>
    </main>

    <script src="../../auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
