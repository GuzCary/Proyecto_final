<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpieza - Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Insumos de Limpieza</h1>
        <div class="header-acciones">
            <a id="link-admin" class="link-admin" href="../../admin/vehiculos/index.html" hidden>&larr; Panel admin</a>
            <button id="btnLogout" class="btn-logout">Salir</button>
        </div>
    </header>

    <main class="main-container">
        <section class="card">
            <h2 id="form-titulo">Registrar Insumo</h2>
            <form id="form-producto" class="form-grid">
                <input type="hidden" id="id_encriptado" name="id_encriptado">
                <div class="form-group">
                    <label for="nombre">Nombre del Producto</label>
                    <input type="text" id="nombre" name="nombre" maxlength="100" required autocomplete="off">
                </div>
                <div class="form-acciones">
                    <button type="submit" id="btn-guardar" class="btn-primary">Registrar</button>
                    <button type="button" id="btn-cancelar" class="btn-secondary" style="display: none;">Cancelar</button>
                </div>
            </form>
            <div id="mensaje" class="mensaje-alerta"></div>
        </section>

        <section class="card">
            <h2>Inventario y Control de Stock</h2>
            <div id="contenedor-productos" class="productos-grid"></div>
        </section>
    </main>

    <script src="../../auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
