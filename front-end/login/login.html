<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Automotora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor principal centrado con Flexbox -->
    <main class="login-wrapper">
        <section class="login-card">
            <header class="login-header">
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus credenciales del sistema</p>
            </header>

            <!-- Formulario con CSS Grid -->
            <form id="form-login" class="login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="contrasenia">Contraseña</label>
                    <input type="password" id="contrasenia" name="contrasenia" required autocomplete="current-password">
                </div>

                <button type="submit" id="btn-submit" class="btn-ingresar">Ingresar</button>
            </form>

            <!-- Mensajes de respuesta -->
            <div id="mensaje" class="mensaje-alerta"></div>

            
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
